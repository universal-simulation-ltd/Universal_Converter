<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FE8C01"/>
      <stop offset="1" stop-color="#E05504"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#111C2E"/>
      <stop offset="1" stop-color="#0A0E16"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.18" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#FE8C01" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FE8C01" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="1200" fill="#0A0E16"/>
  <g transform="translate(0 285)">
  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#sheen)"/>
  <rect width="1200" height="8" fill="url(#brand)"/>

  <!-- The product mark, on the shared squircle tile -->
  <g transform="translate(96 150)">
    <rect width="132" height="132" rx="33" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>
    <g transform="translate(66 66) scale(3.1) translate(-16 -16)">
      <g fill="none" stroke="#FE8C01" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 13.1A8.5 8.5 0 0 1 24 13.1"/>
        <path d="M21.2 11.6 24 13.1 22.6 16"/>
        <path d="M24 18.9A8.5 8.5 0 0 1 8 18.9"/>
        <path d="M10.8 20.4 8 18.9 9.4 16"/>
      </g>
      <g fill="#FF9A1F">
        <rect x="12.6" y="13.6" width="1.8" height="4.8" rx="0.9"/>
        <rect x="15.1" y="11.4" width="1.8" height="9.2" rx="0.9"/>
        <rect x="17.6" y="14.2" width="1.8" height="3.6" rx="0.9"/>
      </g>
    </g>
  </g>

  <text x="270" y="205" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="68" font-weight="700" letter-spacing="-2" fill="#FFFFFF">Universal Converter</text>
  <text x="272" y="262" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="500" fill="#9FB0C6">Convert audio &amp; images in your browser</text>

  <!-- The claim, which is the whole product -->
  <g transform="translate(96 344)">
    <rect width="516" height="62" rx="31" fill="#2F9E57" fill-opacity="0.14" stroke="#2F9E57" stroke-opacity="0.35"/>
    <g transform="translate(30 20)" fill="none" stroke="#5FD08A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="9" width="16" height="11" rx="2.5"/>
      <path d="M7 9V6a4 4 0 0 1 8 0v3"/>
    </g>
    <text x="74" y="40" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="26" font-weight="600" fill="#8FE0AC">Nothing is uploaded — it all runs on your device</text>
  </g>

  <!-- Format chips: what it actually does -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="600">
    <g transform="translate(96 452)">
      <rect width="112" height="52" rx="12" fill="url(#brand)"/>
      <text x="56" y="34" text-anchor="middle" fill="#FFFFFF">MP3</text>
    </g>
    <g transform="translate(220 452)"><rect width="112" height="52" rx="12" fill="#1B2739"/><text x="56" y="34" text-anchor="middle" fill="#C7D3E4">M4A</text></g>
    <g transform="translate(344 452)"><rect width="122" height="52" rx="12" fill="#1B2739"/><text x="61" y="34" text-anchor="middle" fill="#C7D3E4">Opus</text></g>
    <g transform="translate(478 452)"><rect width="122" height="52" rx="12" fill="#1B2739"/><text x="61" y="34" text-anchor="middle" fill="#C7D3E4">FLAC</text></g>
    <g transform="translate(612 452)"><rect width="112" height="52" rx="12" fill="#1B2739"/><text x="56" y="34" text-anchor="middle" fill="#C7D3E4">WAV</text></g>
    <g transform="translate(736 452)"><rect width="128" height="52" rx="12" fill="#1B2739"/><text x="64" y="34" text-anchor="middle" fill="#C7D3E4">WebP</text></g>
    <g transform="translate(876 452)"><rect width="122" height="52" rx="12" fill="#1B2739"/><text x="61" y="34" text-anchor="middle" fill="#C7D3E4">JPEG</text></g>
    <g transform="translate(1010 452)"><rect width="112" height="52" rx="12" fill="#1B2739"/><text x="56" y="34" text-anchor="middle" fill="#C7D3E4">PNG</text></g>
  </g>

  <!-- UNI·SIM footer line -->
  <g transform="translate(96 556)">
    <text font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="#64748B">
      <tspan fill="#FE8C01">100% free</tspan><tspan fill="#475569"> · </tspan><tspan>open source</tspan><tspan fill="#475569"> · </tspan><tspan>no account</tspan>
    </text>
  </g>
  <text x="1104" y="578" text-anchor="end" font-family="-apple-system, Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="23" font-weight="700" letter-spacing="3" fill="#475569">UNI·SIM</text>
  </g>
</svg>
