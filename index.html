    <!-- ⚠️ THE THEME, BEFORE THE FIRST PIXEL — and it has to be here, inline,
         rather than in the app. `createThemeStore` (the SDK) puts the same
         class on <html> at import time, but that is after the module bundle
         has downloaded and parsed; `index.css` paints <html>'s ground long
         before then, so a dark-mode user would get a light frame first. This
         runs during head parsing, so the class is already there for the first
         paint, and the store then reads the same two keys and agrees.

         Since SDK 0.143 the app key holds this app's OVERRIDE, set in App
         preferences; absent, the app follows the suite-wide choice from Global
         preferences, `universal:color-scheme`. ⚠️ Both fallbacks matter: read
         only the app key and someone who chose Dark globally gets a light first
         frame and then a flip.

         ⚠️ THE APP KEY IS DUPLICATED — `src/stores/themeStore.ts` holds the other
         copy, and renaming one silently puts everybody who chose something here
         back to following global. They are
         held together by the "theme key" block in `scripts/selftest.mjs`,
         which fails `npm test` if the two ever drift.

         Light is the default (the suite rule), so this only ever ADDS `dark`. -->
    <script>
      try {
        var pref = localStorage.getItem('unisim-converter-theme')
          || localStorage.getItem('universal:color-scheme') || 'light'
        if (pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {
        /* private mode, storage disabled: light, exactly as the store falls back. */
      }
    </script>

    <!-- Structured data. The credit James asked for on 2026-09-05 lives in two
         places, and this is the one a search engine can read: the in-app line
         is in the SDK's <AboutAppDialog>, which is a React portal and only
         enters the DOM once somebody opens it, so a crawler never sees it.

         Every value below is taken from THIS FILE's own <title>, description
         and canonical rather than typed again, so the block cannot drift from
         what the page already says about itself. The author matches the app's
         marketing page on unisim.co.uk and points at the same /about-james,
         so both resolve to one person rather than two mentions of a name. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Universal Converter",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web browser",

    }
