# The self-tests (`npm test`, scripts/selftest.mjs), on every push and pull
# request: the WAV, AIFF, MP3, ZIP, PDF and GIF writers checked against readers
# that are not ours. No server, no browser; the browser specs are e2e.yml. Node
# 24 strips the TypeScript types the self-test imports. The AIFF check needs
# macOS `afinfo` and skips itself here, with a warning.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # The GIF checks read our files back with ffmpeg and ffprobe, a GIF
      # implementation that is not ours. Installed only if the runner lacks it.
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1

      - run: npm test
