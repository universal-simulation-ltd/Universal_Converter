# The self-tests (`npm test`, scripts/selftest.mjs), on every push and pull
# request: the WAV, AIFF, MP3, ZIP, PDF and GIF writers checked against readers
# that are not ours. No server, no browser; the browser specs are e2e.yml. Node
# 24 strips the TypeScript types the self-test imports. The AIFF check needs
# macOS `afinfo` and skips itself here, with a warning.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: unit tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      # ffmpeg and ffprobe, a GIF implementation that is not ours, read our
      # files back. apt from archive.ubuntu.com, not the runner's own Azure
      # mirror: on 2026-10-23 that mirror ran at a few KB/s and an apt install
      # of ffmpeg (16 s on a good day) timed the job out. If apt is still slow,
      # a static build from GitHub instead.
      - name: ffmpeg
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
            if ! sudo timeout 180 sh -c 'apt-get update -q && apt-get install -y -q --no-install-recommends ffmpeg'; then
              echo "apt was too slow; using BtbN's static build"
              curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP"
              echo "$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
              export PATH="$RUNNER_TEMP/ffmpeg-master-latest-linux64-gpl/bin:$PATH"
            fi
          fi
          ffmpeg -version | head -1

      - run: npm test
