# The browser specs in `e2e/` (Files, Images, Video, routing, folders, the
# queue), on every push and pull request. Each spec starts its own Vite dev
# server on a free port. What is left out, and why, is SKIP at the top of
# e2e/run-all.mjs; a spec that fails, then passes on its one retry, is
# reported as FLAKY and does not turn the run red. One spec at a time: two at
# once made routing and video time out now and then, even on a Mac.
#
# Playwright is not a dependency of the app (locally the specs borrow a
# sibling repo's copy, found by looking — see playwrightCandidates() in each
# spec, which also finds this checkout's own node_modules), so it is
# installed here with --no-save at the version below.
#
# The jobs run in Playwright's own image for the version below, which already
# holds the browsers AND their system libraries: installing the libraries with
# `playwright install-deps` on a bare runner took 9 to 38 minutes of apt per
# job (Universal PDF, measured 2026-10-22), where pulling the image takes about
# one. The image is the browser cache. Keep its tag and PLAYWRIGHT_VERSION the
# same as each other, and as the Playwright version npm installs.
#
# Free: the repo is public, so ubuntu-latest minutes cost nothing.

name: e2e

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch or PR cancels the older run, but not on main: main
# moves often (several sessions push to it), and every commit there should
# get its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: '1.62.1'
  E2E_RESULTS: e2e-results

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # --ipc=host: Chromium runs out of shared memory in a container
      # without it. --user 1001: the runner's own user (Playwright's advice),
      # so the checkout is writable and Firefox is not started as root.
      options: --ipc=host --user 1001
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Playwright ${{ env.PLAYWRIGHT_VERSION }}
        run: npm install --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"

      # What `predev` does before `npm run dev`: the specs start Vite
      # directly, so the FLAC encoder's files are copied here.
      - run: node scripts/sync-flac.mjs

      - name: Run the specs
        run: node e2e/run-all.mjs --jobs 1

      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-results/
          retention-days: 14
